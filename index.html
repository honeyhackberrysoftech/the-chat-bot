<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <!-- bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <!-- costum-style -->
  <link rel="stylesheet" href="assets/css/global.css">
  <style>
    .container{
      display: flex;
  justify-content: center; 
  align-items: center;  
  min-height: 100vh;  
    }
    .favicon-signup{
      width: 30px;
    }
  </style>

<body>
  <main>
    <div class="container">
    <div class="login-card">
    <h3 class="text-center mb-3"><img class="favicon-signup" src="assets/image/hackberry-favicon.png" alt="">Sign In</h3>
    <form id="loginForm" novalidate>
      <div class="mb-3">
        <label for="email" class="form-label">Email Address</label>
        <input type="email" class="form-control" id="email" placeholder="Enter email" required>
        <div class="invalid-feedback" id="emailError">Please enter a valid email.</div>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="password" class="form-control" id="password" placeholder="Enter password" required minlength="6">
        <div class="invalid-feedback" id="passwordError">Password is required.</div>
      </div>
      <button type="submit" class="btn btn-custom w-100">Sign In</button>
    </form>
  </div>
 </div>
     <!-- Large blurred ring in background -->
  <div class="background-ring"></div>
  </main>
  <!-- bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

  <script>
     // ✅ Only these credentials are accepted
    const validEmail = "info@hackberrysoftech.com";
    const validPassword = "123456";

    const loginForm = document.getElementById("loginForm");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const emailError = document.getElementById("emailError");
    const passwordError = document.getElementById("passwordError");

    loginForm.addEventListener("submit", function (e) {
      e.preventDefault();

      // Reset states
      emailInput.classList.remove("is-invalid");
      passwordInput.classList.remove("is-invalid");

      let hasError = false;

      // 1. Built-in validation (required + email format + minlength)
      if (!loginForm.checkValidity()) {
        loginForm.classList.add("was-validated");
        return;
      }

      // 2. Custom validation
      if (emailInput.value.trim() !== validEmail) {
        emailInput.classList.add("is-invalid");
        emailError.textContent = "❌ Email not found!";
        hasError = true;
      }

      if (passwordInput.value.trim() !== validPassword) {
        passwordInput.classList.add("is-invalid");
        passwordError.textContent = "❌ Incorrect password!";
        hasError = true;
      }

      // 3. Success → redirect
      if (!hasError) {
        window.location.href = "index1.html";
      }
    });
  </script>
</body>

</html>
