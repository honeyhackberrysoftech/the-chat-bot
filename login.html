<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <!-- bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <!-- costum-style -->
  <link rel="stylesheet" href="assets/css/global.css">
</head>

<body>
  <main>
    <div class="login-card text-center">
      <h3>Login</h3>
      <form id="loginForm" novalidate>
        <div class="mb-3 text-start">
          <label for="email" class="form-label">Email address</label>
          <input type="email" class="form-control" id="email" placeholder="Enter email" required>
          <div class="invalid-feedback">Please enter a valid email address.</div>
        </div>
        <div class="mb-3 text-start">
          <label for="password" class="form-label">Password</label>
          <input type="password" class="form-control" id="password" placeholder="Enter password" required minlength="6">
          <div class="invalid-feedback">Password must be at least 6 characters long.</div>
        </div>
        <div id="errorMsg" class="text-danger mb-2"></div>
        <button type="submit" class="btn btn-custom w-100">Login</button>
      </form>
      <p class="mt-3">Don't have an account? <a href="#">Register</a></p>
    </div>
     <!-- Large blurred ring in background -->
  <div class="background-ring"></div>
  </main>
  <!-- bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <!-- radio button -->
  <script>
    // Set your valid login credentials here
    const validEmail = "info@hackberrysoftech.com";
    const validPassword = "123456";

    const loginForm = document.getElementById("loginForm");
    const errorMsg = document.getElementById("errorMsg");

    loginForm.addEventListener("submit", function (e) {
      e.preventDefault(); // stop default form action

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();

      if (email === validEmail && password === validPassword) {
        // ✅ Correct login → redirect
        window.location.href = "index.html";
      } else {
        // ❌ Wrong credentials → show error
        errorMsg.textContent = "Invalid email or password!";
      }
    });
  </script>
</body>

</html>
